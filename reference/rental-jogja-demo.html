<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script>
      window.Swal ||
        document.write(
          '<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.14.5/sweetalert2.all.min.js"><\/script>',
        );
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script>
      window.jspdf ||
        document.write(
          '<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>',
        );
    </script>
    <title>Jogja Rental Mobil</title>
    <style>
      :root {
        --bg: #f3f5f9;
        --card: #fff;
        --tx: #121a2e;
        --mut: #5d677d;
        --pri: #d9a441;
        --prt: #1a1204;
        --lnk: #8a5d0c;
        --bd: #e1e5ee;
        --dng: #dc2626;
        --wrn: #b7791f;
        --ok: #15803d;
        --ink: #101a33;
        --r: 18px;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c1222;
          --card: #151e36;
          --tx: #eef1f8;
          --mut: #9aa6c0;
          --lnk: #e8b954;
          --bd: #26314e;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c1222;
        --card: #151e36;
        --tx: #eef1f8;
        --mut: #9aa6c0;
        --lnk: #e8b954;
        --bd: #26314e;
      }
      html {
        scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px);
        scroll-behavior: smooth;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.55 "DM Sans",
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      h1,
      h2,
      .logo,
      .price {
        font-family: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        background: rgba(16, 26, 51, 0.92);
        backdrop-filter: blur(10px);
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        z-index: 5;
      }
      header a {
        color: #e8b954;
        text-decoration: none;
        font-weight: 600;
      }
      .logo {
        font-weight: 800;
        font-size: 1.1rem;
        color: #fff !important;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo i {
        font-style: normal;
        background: var(--pri);
        border-radius: 9px;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        font-size: 1rem;
      }
      a {
        color: var(--lnk);
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
      }
      .hero {
        position: relative;
        overflow: hidden;
        background-color: var(--ink);
        background-image:
          radial-gradient(
            circle at 50% 0,
            transparent 15px,
            rgba(217, 164, 65, 0.22) 16px,
            transparent 17px
          ),
          radial-gradient(
            circle at 0 50%,
            transparent 15px,
            rgba(217, 164, 65, 0.22) 16px,
            transparent 17px
          );
        background-size: 34px 34px;
        color: #fff;
        border-radius: 24px;
        padding: 34px 22px 26px;
        margin-bottom: 22px;
      }
      .hero:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          var(--ink) 35%,
          rgba(16, 26, 51, 0.55)
        );
        pointer-events: none;
      }
      .hero > * {
        position: relative;
        z-index: 1;
      }
      .hero h1 {
        margin: 0 0 10px;
        font-size: clamp(1.9rem, 7vw, 3rem);
        line-height: 1.08;
        font-weight: 800;
        max-width: 15em;
      }
      .hero p {
        margin: 0 0 18px;
        max-width: 30em;
        color: #cbd3e6;
      }
      .hero svg {
        position: absolute;
        right: -30px;
        bottom: -6px;
        width: min(60%, 380px);
        z-index: 1;
        opacity: 0.95;
        animation: drive 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes drive {
        from {
          transform: translateX(120px);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero svg {
          animation: none;
        }
        html {
          scroll-behavior: auto;
        }
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .chip {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 99px;
        padding: 5px 12px;
        font-size: 0.82rem;
        white-space: nowrap;
      }
      .cta {
        display: inline-block;
        background: var(--pri);
        color: var(--prt);
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 700;
        text-decoration: none;
      }
      .scroll {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .dest {
        flex: 0 0 auto;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 10px 14px;
        font-weight: 500;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 16px;
      }
      .car {
        padding: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .car .top1 {
        background: linear-gradient(135deg, var(--ink), #26407a);
        padding: 22px 18px 14px;
        font:
          800 1.5rem/1 "Bricolage Grotesque",
          sans-serif;
        color: #f3e3bd;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .car .top1 small {
        font-size: 0.75rem;
        background: var(--pri);
        color: var(--prt);
        border-radius: 99px;
        padding: 3px 10px;
        font-weight: 700;
        font-family: "DM Sans", sans-serif;
      }
      .car .bd {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }
      .car button {
        margin-top: 10px;
      }
      .price {
        color: var(--lnk);
        font-weight: 800;
        font-size: 1.15rem;
      }
      h2 {
        font-size: 1.35rem;
        margin: 28px 0 12px;
        font-weight: 800;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .step b {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--pri);
        margin-bottom: 8px;
        font-family: "Bricolage Grotesque", sans-serif;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--mut);
        margin: 12px 0 5px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1.5px solid var(--bd);
        border-radius: 12px;
        background: var(--bg);
        color: var(--tx);
        font: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        outline: 3px solid rgba(217, 164, 65, 0.55);
        outline-offset: 1px;
        border-color: var(--pri);
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 12px;
        padding: 11px 15px;
        cursor: pointer;
        background: var(--pri);
        color: var(--prt);
        font-weight: 700;
      }
      button.g {
        background: transparent;
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      button.d {
        background: var(--dng);
        color: #fff;
      }
      button.w {
        background: #25d366;
        color: #04230f;
      }
      .full {
        width: 100%;
        margin-top: 16px;
        padding: 14px;
      }
      .est {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px dashed var(--pri);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .est b {
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 1.2rem;
        color: var(--lnk);
      }
      .formgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
      }
      .formgrid .s2 {
        grid-column: 1/-1;
      }
      @media (max-width: 520px) {
        .formgrid {
          grid-template-columns: 1fr;
        }
        .hero svg {
          opacity: 0.35;
        }
        .hero:after {
          background: rgba(16, 26, 51, 0.55);
        }
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
        overflow-x: auto;
      }
      .tabs button {
        white-space: nowrap;
      }
      .badge {
        font-size: 0.72rem;
        padding: 3px 10px;
        border-radius: 99px;
        color: #fff;
        background: var(--wrn);
        font-weight: 700;
      }
      .badge.ok {
        background: var(--ok);
      }
      .badge.no {
        background: var(--dng);
      }
      .item {
        margin-bottom: 12px;
      }
      .item .top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .mut {
        color: var(--mut);
        font-size: 0.88rem;
      }
      .hide {
        display: none !important;
      }
      footer {
        text-align: center;
        color: var(--mut);
        font-size: 0.82rem;
        padding: 26px 0 10px;
      }
      #toasts {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 66px);
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 50;
        pointer-events: none;
      }
      .toast {
        background: var(--ink);
        color: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        max-width: 90%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        border-left: 5px solid #22c55e;
        animation: drive2 0.3s both;
      }
      @keyframes drive2 {
        from {
          transform: translateY(-12px);
          opacity: 0;
        }
      }
      .toast.err {
        border-color: var(--dng);
      }
      .toast.inf {
        border-color: #3b82f6;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(5, 10, 25, 0.6);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 40;
      }
      .modal > div {
        background: var(--card);
        width: 100%;
        max-width: 520px;
        border-radius: 22px 22px 0 0;
        padding: 20px;
        max-height: 90%;
        overflow: auto;
      }
      @media (min-width: 600px) {
        .modal {
          align-items: center;
        }
        .modal > div {
          border-radius: 22px;
        }
      }
      .demo {
        font-size: 0.8rem;
        background: var(--bg);
        border: 1px dashed var(--bd);
        border-radius: 10px;
        padding: 8px;
        margin-top: 12px;
        color: var(--mut);
      }
      .cars {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      .vc {
        display: flex;
        flex-direction: column;
      }
      .vc .nm {
        font:
          800 1.15rem/1.2 "Bricolage Grotesque",
          sans-serif;
      }
      .vc .mid {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin: 12px 0;
      }
      .chips2 {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        flex: 1;
        align-content: center;
      }
      .chips2 span {
        background: var(--bg);
        border-radius: 8px;
        padding: 4px 9px;
        font-size: 0.78rem;
        font-weight: 500;
      }
      .ph {
        position: relative;
        overflow: hidden;
        flex: 0 0 48%;
        aspect-ratio: 16/10;
        border-radius: 10px;
      }
      .ph img,
      .crop img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: center;
        pointer-events: none;
        user-select: none;
      }
      .nop {
        width: 100%;
        height: 100%;
        color: var(--bd);
        padding: 8px;
      }
      .vc .bt {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid var(--bd);
        padding-top: 12px;
        gap: 10px;
        margin-top: auto;
      }
      .vc .full {
        margin-top: 12px;
        padding: 11px;
      }
      .pr {
        text-align: right;
        line-height: 1.3;
      }
      .crop {
        position: relative;
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16/10;
        background: var(--bg);
        border: 1.5px dashed var(--pri);
        border-radius: 12px;
        touch-action: none;
        cursor: grab;
      }
      .hero .lg {
        position: absolute;
        right: 22px;
        bottom: 22px;
        width: min(36%, 250px);
        height: auto;
        background: #fff;
        border-radius: 20px;
        padding: 6px;
        z-index: 1;
        animation: drive 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @media (min-width: 521px) {
        .hero > *:not(.lg) {
          max-width: 60%;
        }
      }
      @media (max-width: 520px) {
        .hero .lg {
          position: static;
          display: block;
          width: 62%;
          margin: 20px auto 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero .lg {
          animation: none;
        }
      }
      .over {
        position: static;
      }
      .swal2-popup {
        background: var(--card) !important;
        color: var(--tx) !important;
        font-family: "DM Sans", system-ui, sans-serif !important;
        border-radius: 20px !important;
      }
      .swal2-title {
        color: var(--tx) !important;
        font-family: "Bricolage Grotesque", sans-serif !important;
      }
      .swal2-html-container {
        color: var(--mut) !important;
      }
      .swal2-confirm {
        background: var(--pri) !important;
        color: var(--prt) !important;
        font-weight: 700 !important;
        border-radius: 12px !important;
      }
      .swal2-cancel {
        border-radius: 12px !important;
      }
      .swal2-container.swal2-top {
        padding-top: calc(env(safe-area-inset-top, 0px) + 8px) !important;
      }
      .lp {
        background: #fff;
        border-radius: 14px;
        padding: 8px;
        max-width: 260px;
      }
      .lp img {
        width: 100%;
        display: block;
      }
      .okc {
        border: 2px solid var(--ok);
        margin-bottom: 12px;
      }
      .okc b {
        color: var(--ok);
      }
    </style>
  </head>
  <body>
    <header>
      <a class="logo" href="#/"><i>J</i>Jogja Rental</a><span id="nav"></span>
    </header>
    <div id="toasts"></div>
    <div class="wrap" id="app"></div>
    <div id="modal" class="modal hide"></div>

    <script>
      const KEY = "jr_demo_v2";
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const rp = (n) => "Rp " + Number(n).toLocaleString("id-ID");
      const uid = () =>
        Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      const seed = {
        wa: "6281234567890",
        cars: [
          {
            id: "c1",
            name: "Toyota Avanza",
            cat: "atau setara MPV standar",
            seat: 7,
            bags: 1,
            trans: "Manual",
            ac: true,
            price: 350000,
          },
          {
            id: "c2",
            name: "Toyota Innova Reborn",
            cat: "atau setara MPV premium",
            seat: 7,
            bags: 2,
            trans: "Otomatis",
            ac: true,
            price: 550000,
          },
          {
            id: "c3",
            name: "Daihatsu Ayla",
            cat: "atau setara mini",
            seat: 5,
            bags: 1,
            trans: "Manual",
            ac: true,
            price: 250000,
          },
          {
            id: "c4",
            name: "Toyota Hiace",
            cat: "atau setara van penumpang",
            seat: 14,
            bags: 6,
            trans: "Manual",
            ac: true,
            price: 900000,
          },
        ],
        orders: [],
      };
      let db = load(),
        admin = false;
      function load() {
        try {
          const r = localStorage.getItem(KEY);
          if (r) return JSON.parse(r);
        } catch (e) {}
        return JSON.parse(JSON.stringify(seed));
      }
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(db));
          return true;
        } catch (e) {
          toast("Penyimpanan penuh. Gunakan foto lebih kecil", "err");
          return false;
        }
      }
      try {
        admin = sessionStorage.getItem("jr_admin") === "1";
      } catch (e) {}

      function openModal(h) {
        const m = $("#modal");
        m.innerHTML = "<div>" + h + "</div>";
        m.classList.remove("hide");
      }
      function closeModal() {
        $("#modal").classList.add("hide");
      }
      $("#modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") closeModal();
      });

      function route() {
        const h = location.hash;
        if (h === "#/admin") return admin ? dash() : login();
        landing();
      }
      window.addEventListener("hashchange", route);

      function nav() {
        const L = document.querySelector(".logo");
        if (L)
          L.innerHTML =
            "<i>" +
            esc(S().brand.charAt(0).toUpperCase()) +
            "</i>" +
            esc(S().brand);
        $("#nav").innerHTML = admin
          ? '<a href="#/">Beranda</a> · <a href="#/admin">Dashboard</a>'
          : location.hash === "#/admin"
            ? '<a href="#/">Beranda</a>'
            : '<a href="#/admin">Admin</a>';

          toast("PDF gagal dibuat. Pesan WhatsApp tetap bisa dikirim.", "err");
        }
        openModal(`<h2 style="margin-top:0">${cx ? "Pesanan dibatalkan" : "Pesanan dikonfirmasi"}</h2><p class="mut">${esc(o.name)} · ${esc(o.phone)} · kode ${esc(o.code || "-")}.<br>Kirim ${cx ? "info pembatalan" : "invoice"} ke pelanggan dengan dua langkah:</p>
${blob ? `<button class="full" id="k1">1. Bagikan atau simpan PDF ${cx ? "pembatalan" : "invoice"}</button>` : ""}
<button class="w full" id="k2">${blob ? "2. " : ""}Buka chat WhatsApp pelanggan</button>
<p class="mut" style="margin-top:12px">Teks pesan sudah terisi. WhatsApp tidak mengizinkan lampiran terkirim otomatis dari web, jadi lampirkan file PDF dari langkah 1 pada chat. Di HP, langkah 1 membuka menu bagikan sehingga PDF bisa langsung dikirim lewat WhatsApp.</p>
<button class="g full" onclick="closeModal()">Selesai</button>`);
        if ($("#k1"))
          $("#k1").onclick = async () => {
            try {
              const f = new File([blob], fn, { type: "application/pdf" });
              if (navigator.canShare && navigator.canShare({ files: [f] })) {
                await navigator.share({ files: [f], title: fn, text: msg });
                return;
              }
            } catch (e) {
              if (e && e.name === "AbortError") return;
            }
            try {
              const dl = window.claude && (await claude.use("downloads"));
              if (!dl) throw 0;
              await dl.save({ filename: fn, data: blob });
              toast("PDF disimpan");
            } catch (e) {
              toast(
                e && e.code === "declined"
                  ? "Penyimpanan dibatalkan"
                  : "Penyimpanan PDF tidak tersedia di tampilan ini",
                "err",
              );
            }
          };
        $("#k2").onclick = () => {
          if (!window.open(url, "_blank"))
            toast("Pop-up diblokir, izinkan pop-up lalu coba lagi", "err");
        };
      }
      function cancelOrder(id) {
        openModal(
          `<h2 style="margin-top:0">Batalkan pesanan</h2><label>Alasan pembatalan (opsional, ikut dikirim ke pelanggan)</label><textarea id="rs" rows="3" placeholder="Contoh: unit tidak tersedia pada tanggal tersebut"></textarea><div class="row"><button class="d" id="cx">Batalkan dan kirim info</button><button class="g" onclick="closeModal()">Kembali</button></div>`,
        );
        $("#cx").onclick = () => {
          const o = db.orders.find((x) => x.id === id);
          o.status = "Dibatalkan";
          o.reason = $("#rs").value.trim();
          if (!save()) return;
          closeModal();
          dash();
          sendPanel(id, "cancel");
        };
      }
      function doConfirm(id) {
        const o = db.orders.find((x) => x.id === id);
        o.status = "Dikonfirmasi";
        if (!save()) return;
        dash();
        sendPanel(id, "confirm");
      }
      function rejectOrder(id) {
        ask("Tolak pesanan ini?", () => {
          db.orders.find((x) => x.id === id).status = "Ditolak";
          save();
          toast("Pesanan ditolak", "inf");
          dash();
        });
      }
      function delOrder(id) {
        ask("Hapus pesanan ini permanen?", () => {
          db.orders = db.orders.filter((x) => x.id !== id);
          save();
          toast("Pesanan dihapus", "err");
          dash();
        });
      }
      function editOrder(id) {
        const o = db.orders.find((x) => x.id === id);
        openModal(`<h2 style="margin-top:0">Edit Pesanan</h2>
<label>Nama</label><input id="en" value="${esc(o.name)}">
<label>No. HP</label><input id="ep" value="${esc(o.phone)}">
<label>Mobil</label><select id="ec">${db.cars.map((c) => `<option value="${c.id}" ${c.id === o.car ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
<label>Tanggal</label><input id="ed" type="date" value="${esc(o.date)}">
<label>Lama (hari)</label><input id="eh" type="number" min="1" value="${o.days}">
<label>Status</label><select id="es">${["Menunggu", "Dikonfirmasi", "Dibatalkan"].map((s) => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select>
<div class="row"><button id="sv">Simpan</button><button class="g" onclick="closeModal()">Batal</button></div>`);
        $("#sv").onclick = () => {
          Object.assign(o, {
            name: $("#en").value.trim(),
            phone: $("#ep").value.trim(),
            car: $("#ec").value,
            date: $("#ed").value,
            days: parseInt($("#eh").value) || 1,
            status: $("#es").value,
          });
          save();
          closeModal();
          toast("Pesanan diperbarui");
          dash();
        };
      }

      const NOP =
        '<svg viewBox="0 0 400 170" class="nop"><path d="M30 120c0-14 8-22 22-26l36-30c8-7 18-10 30-10h104c14 0 26 5 36 15l24 22c24 2 40 6 44 18v14c0 6-4 10-10 10H40c-6 0-10-4-10-13z" fill="currentColor"/><circle cx="104" cy="132" r="20" fill="var(--card)"/><circle cx="300" cy="132" r="20" fill="var(--card)"/></svg>';
      function pic(c) {
        const p = c.pos || { x: 0, y: 0, z: 1 };
        return c.img
          ? `<img src="${c.img}" alt="${esc(c.name)}" style="transform:translate(${p.x}%,${p.y}%) scale(${p.z})">`
          : NOP;
      }
      function carCard(c, adm) {
        return `<div class="card vc"><b class="nm">${esc(c.name)}</b><div class="mut">${esc(c.cat || "atau setara")}</div>
<div class="mid"><div class="chips2"><span>${esc(c.seat)} kursi</span><span>${esc(c.bags ?? 2)} bagasi</span><span>${esc(c.trans || "Otomatis")}</span>${c.ac !== false ? "<span>AC</span>" : ""}</div><div class="ph">${pic(c)}</div></div>
<div class="bt"><div class="mut">Pembatalan gratis<br>Kilometer tidak terbatas</div><div class="pr"><span class="mut">Mulai dari</span><div class="price">${rp(c.price)}</div><span class="mut">per hari</span></div></div>
${adm ? `<div class="row"><button class="g" onclick="carForm('${c.id}')">Edit</button><button class="d" onclick="delCar('${c.id}')">Hapus</button></div>` : `<button class="full" onclick="pick('${c.id}')">Pilih mobil ini</button>`}</div>`;
      }
      function carsView() {
        $("#tb").innerHTML =
          `<button onclick="carForm()">Tambah mobil</button><div class="grid cars" style="margin-top:12px">${db.cars.map((c) => carCard(c, true)).join("") || '<p class="mut">Belum ada mobil.</p>'}</div>`;
      }
      function carForm(id) {
        const c = id
          ? carOf(id)
          : {
              name: "",
              cat: "atau setara",
              seat: 5,
              bags: 2,
              trans: "Otomatis",
              ac: true,
              price: 300000,
            };
        let img = c.img || "",
          pos = Object.assign({ x: 0, y: 0, z: 1 }, c.pos || {}),
          im = null,
          dr = null;
        openModal(`<h2 style="margin-top:0">${id ? "Edit" : "Tambah"} mobil</h2>
<label>Nama mobil</label><input id="cn" value="${esc(c.name)}">
<label>Kategori</label><input id="cc" value="${esc(c.cat || "")}" placeholder="atau setara MPV standar">
<div class="formgrid"><div><label>Jumlah kursi</label><input id="cs" type="number" min="1" value="${esc(c.seat)}"></div>
<div><label>Jumlah bagasi</label><input id="cb" type="number" min="0" value="${esc(c.bags ?? 2)}"></div>
<div><label>Transmisi</label><select id="ct">${["Otomatis", "Manual"].map((t) => `<option ${t === (c.trans || "Otomatis") ? "selected" : ""}>${t}</option>`).join("")}</select></div>
<div><label>Harga per hari (Rp)</label><input id="cp" type="number" min="0" value="${esc(c.price)}"></div></div>
<label><input type="checkbox" id="ca" style="width:auto;margin-right:8px" ${c.ac !== false ? "checked" : ""}>Dilengkapi AC</label>
<label>Foto mobil (PNG, JPG, atau WebP)</label><input id="cf" type="file" accept="image/*">
<div id="cw" class="hide"><label>Atur posisi: geser foto di dalam bingkai</label><div class="crop" id="cr"></div>
<label>Zoom</label><input id="cz" type="range" min="0.4" max="3" step="0.05" value="${pos.z}">
<div class="row"><button class="g" id="crs">Reset posisi</button></div></div>
<div class="row" style="margin-top:18px"><button id="sv">Simpan</button><button class="g" onclick="closeModal()">Batal</button></div>`);
        const cr = $("#cr"),
          ap = () => {
            if (im)
              im.style.transform = `translate(${pos.x}%,${pos.y}%) scale(${pos.z})`;
          };
        function show() {
          $("#cw").classList.remove("hide");
          cr.innerHTML = "";
          im = document.createElement("img");
          im.src = img;
          cr.appendChild(im);
          $("#cz").value = pos.z;
          ap();
        }
        if (img) show();
        $("#cf").onchange = (e) => {
          const f = e.target.files[0];
          if (!f) return;
          if (!f.type.startsWith("image/"))
            return toast("File harus berupa gambar", "err");
          const fr = new FileReader();
          fr.onload = () => {
            const t = new Image();
            t.onload = () => {
              const s = Math.min(1, 800 / Math.max(t.width, t.height)),
                cv = document.createElement("canvas");
              cv.width = Math.round(t.width * s);
              cv.height = Math.round(t.height * s);
              cv.getContext("2d").drawImage(t, 0, 0, cv.width, cv.height);
              img = cv.toDataURL("image/webp", 0.85);
              pos = { x: 0, y: 0, z: 1 };
              show();
              toast("Foto dimuat, silakan atur posisinya", "inf");
            };
            t.onerror = () => toast("Gambar tidak dapat dibaca", "err");
            t.src = fr.result;
          };
          fr.readAsDataURL(f);
        };
        cr.onpointerdown = (e) => {
          dr = { x: e.clientX, y: e.clientY, px: pos.x, py: pos.y };
          cr.setPointerCapture(e.pointerId);
        };
        cr.onpointermove = (e) => {
          if (!dr) return;
          const r = cr.getBoundingClientRect();
          pos.x = dr.px + ((e.clientX - dr.x) / r.width) * 100;
          pos.y = dr.py + ((e.clientY - dr.y) / r.height) * 100;
          ap();
        };
        cr.onpointerup = cr.onpointercancel = () => {
          dr = null;
        };
        $("#cz").oninput = (e) => {
          pos.z = +e.target.value;
          ap();
        };
        $("#crs").onclick = () => {
          pos = { x: 0, y: 0, z: 1 };
          $("#cz").value = 1;
          ap();
        };
        $("#sv").onclick = () => {
          const d = {
            name: $("#cn").value.trim(),
            cat: $("#cc").value.trim(),
            seat: parseInt($("#cs").value) || 1,
            bags: parseInt($("#cb").value) || 0,
            trans: $("#ct").value,
            ac: $("#ca").checked,
            price: parseInt($("#cp").value) || 0,
            img,
            pos: { x: +pos.x.toFixed(2), y: +pos.y.toFixed(2), z: pos.z },
          };
          if (!d.name) return toast("Nama mobil wajib diisi", "err");
          if (id) Object.assign(c, d);
          else db.cars.push({ id: uid(), ...d });
          if (!save()) return;
          closeModal();
          toast(id ? "Mobil diperbarui" : "Mobil ditambahkan");
          dash();
        };
      }
      function delCar(id) {
        ask("Hapus mobil ini?", () => {
          db.cars = db.cars.filter((c) => c.id !== id);
          save();
          toast("Mobil dihapus", "err");
          dash();
        });
      }

      function setView() {
        $("#tb").innerHTML =
          `<div class="card"><label>Nomor WhatsApp admin (dicantumkan di pesan ke pelanggan, format 62...)</label><input id="wa" type="tel" value="${esc(db.wa)}">
<button class="full" id="sw">Simpan</button>
<button class="g full" id="rs">Reset data demo</button>
<p class="mut">Saat admin menekan Konfirmasi, WhatsApp terbuka ke nomor pelanggan dengan pesan pesanan telah dikonfirmasi. Nomor admin ini dicantumkan di pesan sebagai kontak.</p></div>`;
        $("#sw").onclick = () => {
          const v = $("#wa").value.replace(/\D/g, "");
          if (v.length < 9) return toast("Nomor tidak valid", "err");
          db.wa = v;
          save();
          toast("Nomor WA disimpan");
        };
        $("#rs").onclick = () =>
          ask("Reset semua data ke awal?", () => {
            db = JSON.parse(JSON.stringify(seed));
            save();
            toast("Data direset", "inf");
            dash();
          });
      }

      route();
    </script>
  </body>
</html>
